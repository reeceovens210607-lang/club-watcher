name: Watch for ticket drops

on:
  schedule:
    - cron: "*/5 * * * *"  # GitHub often runs these late at busy times
  workflow_dispatch:        # "Run workflow" button: boost, or a one-off check
    inputs:
      boost_hours:
        description: "Boost: check every minute for this many hours (0 = just check once)"
        type: choice
        options: ["0", "1", "2", "3", "4", "5"]
        default: "2"

# Boosts get their own lane, so a queued scheduled check can't cancel one
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'boost' || 'watch' }}
  cancel-in-progress: false

permissions:
  contents: write  # only used by the keep-alive step below

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # boosts run for hours; normal checks take ~30s
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # What's been seen so far lives in the Actions cache, not the public repo
      - uses: actions/cache/restore@v6
        with:
          path: |
            state.json
            drops.csv
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check clubs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BOOST_HOURS: ${{ inputs.boost_hours || '0' }}
        run: python club_watcher.py once

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: |
            state.json
            drops.csv
          key: state-${{ github.run_id }}

      # GitHub pauses schedules in repos with no commits for 60 days
      - name: Keep alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled checks running"
            git push
          fi
