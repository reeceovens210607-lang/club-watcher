name: Watch for ticket drops

on:
  schedule:
    - cron: "*/5 * * * *"  # GitHub often runs these late at busy times
  workflow_dispatch:        # "Run workflow" button for testing

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write  # only used by the keep-alive step below

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # What's been seen so far lives in the Actions cache, not the public repo
      - uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            drops.csv
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check clubs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python club_watcher.py once

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            state.json
            drops.csv
          key: state-${{ github.run_id }}

      # GitHub pauses schedules in repos with no commits for 60 days
      - name: Keep alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled checks running"
            git push
          fi
